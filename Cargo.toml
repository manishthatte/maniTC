[package]
name = "manitc"
version = "0.1.0"
edition = "2021"
description = "The maniT balanced ternary language compiler"
license = "AGPL-3.0-or-later"
authors = ["Manish Jagdish Thatte <manish@manitlab.org>"]
repository = "https://github.com/manishthatte/manitc"
homepage = "https://www.manitlab.org"
readme = "README.md"
keywords = ["ternary", "balanced-ternary", "compiler", "language", "t3isa"]
categories = ["compilers", "development-tools"]

[lib]
name = "manitc"
path = "src/lib.rs"

[[bin]]
name = "manitc"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
tower-lsp = "0.20"
tokio = { version = "1", features = ["full"] }
serde_json = "1"
