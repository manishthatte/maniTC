name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: build + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain versions
        run: |
          rustc --version
          cargo --version
          clang --version

      # The LLVM backend links compiled programs against the ManiT C runtime.
      # With SDL2 and libcurl present the runtime is built in full; without
      # them it falls back to -DMANIT_NO_GUI. CI exercises the full build.
      - name: Install runtime link dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libcurl4-openssl-dev libsdl2-dev libsdl2-ttf-dev

      - name: Build
        run: cargo build --release --locked

      - name: Test
        run: cargo test --all --locked

  examples:
    name: examples
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Install runtime link dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libcurl4-openssl-dev libsdl2-dev libsdl2-ttf-dev

      - name: Build
        run: cargo build --release --locked

      # Every example, on both backends. The list was 11 of 17 here and 3 of 17
      # below, left over from when that was the truth; the whole set has passed
      # on both backends since the fix campaign, so CI was under-testing by 6
      # examples on T3 and 14 on LLVM. This file's own instruction is to add
      # each one as it starts working "so that a fix can never silently
      # regress" — which only holds if the list is kept current.
      - name: T3ISA backend — compile and run on the emulator
        run: |
          set -euo pipefail
          for ex in bridge_demo capability_demo concurrency crypto_demo database data_structures \
                    fibonacci float_demo hello neural_net oop patent_classify stream_demo \
                    ternary_calculator ternary_demo ternary_sort three_valued_logic; do
            echo "::group::$ex"
            ./target/release/manitc compile --target t3 "examples/$ex.mt" -o "/tmp/$ex.t3b"
            ./target/release/manitc run-t3 "/tmp/$ex.t3b" > "/tmp/$ex.t3.out"
            test -s "/tmp/$ex.t3.out"
            head -5 "/tmp/$ex.t3.out"
            echo "::endgroup::"
          done

      - name: LLVM backend — compile and run natively
        run: |
          set -euo pipefail
          for ex in bridge_demo capability_demo concurrency crypto_demo database data_structures \
                    fibonacci float_demo hello neural_net oop patent_classify stream_demo \
                    ternary_calculator ternary_demo ternary_sort three_valued_logic; do
            echo "::group::$ex"
            ./target/release/manitc compile "examples/$ex.mt" --target llvm -o "/tmp/$ex"
            test -x "/tmp/$ex"
            rc=0
            "/tmp/$ex" > "/tmp/$ex.llvm.out" 2>&1 || rc=$?
            test "$rc" -eq 0
            test -s "/tmp/$ex.llvm.out"
            head -5 "/tmp/$ex.llvm.out"
            echo "::endgroup::"
          done

      # R2. `--lang v2` (C4 round-to-nearest division, N5 `int` = 27 trits)
      # changes what these programs COMPUTE, so "it still compiles" is not the
      # claim worth checking — "the two backends still agree" is. Landing C4
      # broke exactly one of the seventeen (data_structures, via report.txt P7,
      # an ABI defect the change exposed rather than caused) and nothing but a
      # parity comparison would have seen it.
      - name: Both backends agree under --lang v2
        run: |
          set -euo pipefail
          for ex in bridge_demo capability_demo concurrency crypto_demo database data_structures \
                    fibonacci float_demo hello neural_net oop patent_classify stream_demo \
                    ternary_calculator ternary_demo ternary_sort three_valued_logic; do
            echo "::group::$ex (v2)"
            ./target/release/manitc compile --lang v2 --target t3 "examples/$ex.mt" -o "/tmp/${ex}_v2"
            trc=0
            ./target/release/manitc run-t3 "/tmp/${ex}_v2.t3b" > "/tmp/${ex}_v2.t3.raw" 2>&1 || trc=$?
            # Drop the "[T3ISA] running ..." banner, which has no counterpart
            # on the other side.
            tail -n +2 "/tmp/${ex}_v2.t3.raw" > "/tmp/${ex}_v2.t3.out"
            ./target/release/manitc compile --lang v2 --target llvm "examples/$ex.mt" -o "/tmp/${ex}_v2.bin"
            lrc=0
            "/tmp/${ex}_v2.bin" > "/tmp/${ex}_v2.llvm.out" 2>&1 || lrc=$?
            test "$trc" -eq 0
            test "$lrc" -eq 0
            diff -u "/tmp/${ex}_v2.t3.out" "/tmp/${ex}_v2.llvm.out"
            echo "::endgroup::"
          done

      - name: Minimal runtime — no SDL2, no libcurl
        run: |
          set -euo pipefail
          MANIT_NO_GUI=1 ./target/release/manitc compile examples/fibonacci.mt \
            --target llvm -o /tmp/fib_minimal
          rc=0
          /tmp/fib_minimal > /tmp/fib_minimal.out 2>&1 || rc=$?
          test "$rc" -eq 0
          head -3 /tmp/fib_minimal.out

  # Recommendation F-8. Section 48 (the T3 emitter panics on a 13-parameter
  # function) and section 49 (three stdlib modules do not parse) are both
  # findings a fuzzer produces in minutes. A compiler that panics is a compiler
  # that can be made to panic by a user.
  #
  # The budget is deliberately short: this is a smoke campaign that catches a
  # regression on the pull request, not a soak. Real soaking happens by running
  # `cargo +nightly fuzz run <target> -- -max_total_time=3600` locally and
  # committing whatever lands in fuzz/artifacts/ — which tests/fuzz_corpus_tests.rs
  # then replays on stable, forever, with no nightly required.
  fuzz:
    name: fuzz front end
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Install nightly and cargo-fuzz
        run: |
          rustup toolchain install nightly --profile minimal --component llvm-tools-preview
          cargo install cargo-fuzz --locked

      - name: Seed the corpus from real maniT source
        run: ./fuzz/seed_corpus.sh

      - name: Fuzz
        run: |
          set -euo pipefail
          for target in fuzz_lex fuzz_parse fuzz_analyze fuzz_pipeline; do
            echo "::group::$target"
            cargo +nightly fuzz run "$target" -- \
              -max_total_time=120 -rss_limit_mb=4096
            echo "::endgroup::"
          done

      # A reproducer is the most valuable thing a fuzz run produces. Losing it
      # means finding the same bug twice.
      - name: Upload crash reproducers
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/
          if-no-files-found: ignore
